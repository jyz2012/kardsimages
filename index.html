<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kards Images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd700;
        }

        .filter-toggle-row {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .toggle-filters-btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-filters-btn:hover {
            background: #ffed4a;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-bar.collapsed {
            display: none;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
        }

        .filter-label {
            font-size: 13px;
            color: #eee;
            white-space: nowrap;
        }

        .filter-option {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            border-radius: 6px;
            color: #eee;
            cursor: pointer;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.02);
        }

        .filter-option input {
            accent-color: #ffd700;
            transform: scale(0.9);
        }

        .filter-select {
            background: #16213e;
            color: #eee;
            border: 2px solid #333;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 0px;
        }

        .filter-select:hover {
            border-color: #ffd700;
        }

        .filter-select:focus {
            outline: none;
            border-color: #ffd700;
        }

        .search-input {
            min-width: 120px;
        }

        .clear-filters-btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .clear-filters-btn:hover {
            background: #ffed4a;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            padding: 50px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
        }

        .download-btn {
            position: absolute;
            top: -50px;
            right: 0;
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #ffed4a;
        }

        .close-btn {
            position: absolute;
            top: -50px;
            left: 0;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #c0392b;
        }

        .selected-close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .selected-close-btn:hover {
            background: #c0392b;
        }

        .error {
            text-align: center;
            color: #e74c3c;
            padding: 50px;
            font-size: 18px;
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            font-size: 16px;
            color: #aaa;
        }

        .top-nav-btn {
            position: fixed;
            top: 2%;
            right: 2%;
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 999;
            text-decoration: none;
            display: inline-block;
        }

        .top-nav-btn:hover {
            background: #ffed4a;
            transform: scale(1.05);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toolbar-btn:hover {
            background: #ffed4a;
        }

        .toolbar-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .selected-count {
            color: #ffd700;
            font-size: 16px;
            margin-left: 10px;
        }

        .card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card.selected {
            box-shadow: 0 0 0 3px #ffd700;
        }

        .card-checkbox {
            position: absolute;
            top: 3%;
            right: 3%;
            width: 24px;
            height: 24px;
            accent-color: #ffd700;
            cursor: pointer;
            z-index: 10;
        }

        .selected-modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .selected-modal.active {
            display: block;
        }

        .selected-modal-content {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .selected-modal-header {
            position: sticky;
            top: 0;
            background: #1a1a2e;
            padding: 20px;
            z-index: 10;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .selected-modal-title {
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
        }

        .selected-modal-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .selected-modal-card {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .selected-modal-card:hover {
            transform: scale(1.02);
        }

        .selected-modal-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .selected-modal-remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .selected-modal-remove-btn:hover {
            background: #c0392b;
        }

        .empty-selected {
            text-align: center;
            color: #aaa;
            padding: 50px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <a href="hq.html" class="top-nav-btn">总部</a>
    <div class="container">
        <h1>Kards 卡牌收藏</h1>
        <div class="filter-toggle-row">
            <button id="toggleFiltersBtn" class="toggle-filters-btn" type="button">筛选</button>
        </div>

        <div class="filter-bar collapsed" id="filterBar">
            <div class="filter-group">
                <span class="filter-label">费用:</span>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="all" checked> 全部</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="0"> 0费</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="1"> 1费</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="2"> 2费</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="3"> 3费</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="4"> 4费</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="5"> 5费</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="6"> 6费</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="cost" value="7+"> 7+费</label>
            </div>

            <div class="filter-group">
                <span class="filter-label">国家:</span>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="all" checked> 全部</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Germany"> 德国</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="USA"> 美国</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Soviet"> 苏联</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Britain"> 英国</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Japan"> 日本</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Italy"> 意大利</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="France"> 法国</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Neutral"> 中立</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Anzac"> 澳新</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Finland"> 芬兰</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="faction" value="Poland"> 波兰</label>
            </div>

            <div class="filter-group">
                <span class="filter-label">稀有度:</span>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="rarity" value="all" checked> 全部</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="rarity" value="Standard"> 普通</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="rarity" value="Limited"> 限定</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="rarity" value="Special"> 特殊</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="rarity" value="Elite"> 精英</label>
            </div>

            <div class="filter-group">
                <span class="filter-label">卡牌类型:</span>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="type" value="all" checked> 全部</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="type" value="infantry"> 步兵</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="type" value="tank"> 坦克</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="type" value="fighter"> 战斗机</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="type" value="bomber"> 轰炸机</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="type" value="artillery"> 炮兵</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="type" value="order"> 指令</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="type" value="countermeasure"> 反制</label>
            </div>

            <div class="filter-group">
                <span class="filter-label">扩展包:</span>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="all" checked> 全部</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="Base"> 基础</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="Allegiance"> 忠诚</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="Breakthrough"> 突破</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="Legions"> 军团</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="WorldAtWar"> 世纪大战</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="TheatersOfWar"> 战区</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="BrotherInArms"> 战友</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="WinterWar"> 冬季战争</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="CovertOps"> 秘密行动</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="BloodAndIron"> 血与铁</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="NavalWarfare"> 海战</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="Homefront"> 国土阵线</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="OceaniaStorm"> 澳新风暴</label>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="set" value="OnlySpawnable"> 衍生牌</label>
            </div>

            <div class="filter-group">
                <span class="filter-label">其他</span>
                <label class="filter-option"><input type="checkbox" class="filter-checkbox" data-group="reserved" value=true> 显示预备卡牌</label>
            </div>

            <div class="filter-group">
                <span class="filter-label">搜索:</span>
                <input type="text" class="filter-select search-input" id="search-input" placeholder="名称/描述...">
            </div>

            <button id="clearFiltersBtn" class="clear-filters-btn" type="button">清除筛选</button>
        </div>
        <div class="toolbar">
            <button id="viewSelectedBtn" class="toolbar-btn" onclick="openSelectedModal()" disabled>预览选中</button>
            <button id="downloadSelectedBtn" class="toolbar-btn" onclick="downloadSelected()" disabled>下载选中</button>
            <span id="selectedCount" class="selected-count">已选择: 0</span>
        </div>
        <div id="loading" class="loading">加载中...</div>
        <div id="gallery" class="gallery"></div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">关闭</button>
            <!-- <button class="close-btn" onclick="selectCard()">选中</button> -->
            <button class="download-btn" onclick="downloadImage()">下载</button>
            <img id="modalImg" src="" alt="放大图片">
        </div>
    </div>

    <div id="selectedModal" class="selected-modal">
        <div class="selected-modal-content">
            <div class="selected-modal-header">
                <span class="selected-modal-title">已选中的卡牌</span>
                <div>
                    <button class="selected-close-btn" onclick="closeSelectedModal()">关闭</button>
                </div>
            </div>
            <div id="selectedGallery" class="selected-modal-gallery"></div>
        </div>
    </div>

    <script>
        let currentImageUrl = '';
        let currentNormalizedName = '';
        let currentCostFilter = ['all'];
        let currentFactionFilter = ['all'];
        let currentRarityFilter = ['all'];
        let currentTypeFilter = ['all'];
        let currentSetFilter = ['all'];
        let showReservedFilter = false;
        let currentSearchQuery = '';
        let allCards = [];
        let selectedCards = new Set();

        function setFilterGroupState(groupName, values) {
            const normalized = values && values.length ? values : ['all'];
            if (groupName === 'cost') currentCostFilter = normalized;
            if (groupName === 'faction') currentFactionFilter = normalized;
            if (groupName === 'rarity') currentRarityFilter = normalized;
            if (groupName === 'type') currentTypeFilter = normalized;
            if (groupName === 'set') currentSetFilter = normalized;
        }

        function resetCheckboxGroup(groupName) {
            document.querySelectorAll(`.filter-checkbox[data-group="${groupName}"]`).forEach((checkbox) => {
                checkbox.checked = checkbox.value === 'all';
            });
            setFilterGroupState(groupName, ['all']);
        }

        function resetReservedFilter() {
            const reservedCheckbox = document.querySelector('.filter-checkbox[data-group="reserved"]');
            if (reservedCheckbox) {
                reservedCheckbox.checked = false;
            }
            showReservedFilter = false;
        }

        function clearAllFilters() {
            resetCheckboxGroup('cost');
            resetCheckboxGroup('faction');
            resetCheckboxGroup('rarity');
            resetCheckboxGroup('type');
            resetCheckboxGroup('set');
            resetReservedFilter();
            document.getElementById('search-input').value = '';
            currentSearchQuery = '';
            updateSelectionUI();
            renderGallery();
        }

        function extractNormalizedName(imageUrl) {
            const parts = imageUrl.split('/');
            const fileName = parts[parts.length - 1];
            return fileName.replace(/\.[^/.]+$/, '');
        }

        function getImageUrl(imageUrl) {
            return `https://images.weserv.nl/?url=ssl:www.kards.com${imageUrl}`;
        }

        function matchesFilter(card) {
            const costMatch = currentCostFilter.includes('all')
                ? true
                : currentCostFilter.some((value) => value === '7+' ? card.kredits >= 7 : card.kredits === Number(value));
            
            const factionMatch = currentFactionFilter.includes('all')
                ? true
                : currentFactionFilter.includes(card.faction);

            const rarityMatch = currentRarityFilter.includes('all')
                ? true
                : currentRarityFilter.includes(card.rarity);

            const typeMatch = currentTypeFilter.includes('all')
                ? true
                : currentTypeFilter.includes(card.type);

            const setMatch = currentSetFilter.includes('all')
                ? true
                : currentSetFilter.includes(card.set);

            const reserved = showReservedFilter === true
                ? true
                : !card.reserved;

            const searchMatch = currentSearchQuery === ''
                ? true
                : (
                    card.id.toLowerCase().includes(currentSearchQuery.toLowerCase().replace(/\s+/g, '_')) ||
                    (card['zh-Title'] && card['zh-Title'].toLowerCase().includes(currentSearchQuery.toLowerCase())) ||
                    (card['zh-text'] && card['zh-text'].toLowerCase().includes(currentSearchQuery.toLowerCase()))
                );
            
            return costMatch && factionMatch && rarityMatch && typeMatch && setMatch && reserved && searchMatch;
        }

        function getFilteredCards() {
            return allCards.filter(matchesFilter);
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            const filteredCards = getFilteredCards();

            filteredCards.forEach((card, displayIndex) => {
                const originalIndex = allCards.indexOf(card);
                const imgUrl = getImageUrl(card.imageUrl);
                const normalizedName = extractNormalizedName(card.imageUrl);

                const cardDiv = document.createElement('div');
                cardDiv.className = `card${selectedCards.has(originalIndex) ? ' selected' : ''}`;
                cardDiv.dataset.index = originalIndex;
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'card-checkbox';
                checkbox.checked = selectedCards.has(originalIndex);
                checkbox.onclick = (e) => {
                    e.stopPropagation();
                    toggleCardSelection(originalIndex);
                };
                
                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = '卡牌';
                img.loading = 'lazy';
                img.onclick = (e) => {
                    e.stopPropagation();
                    openModal(imgUrl, normalizedName);
                };
                
                cardDiv.onclick = () => toggleCardSelection(originalIndex);
                
                cardDiv.appendChild(checkbox);
                cardDiv.appendChild(img);
                gallery.appendChild(cardDiv);
            });
        }

        function toggleCardSelection(index) {
            if (selectedCards.has(index)) {
                selectedCards.delete(index);
            } else {
                selectedCards.add(index);
            }
            updateSelectionUI();
            renderGallery();
        }

        function updateSelectionUI() {
            const totalSelected = selectedCards.size;
            
            document.getElementById('selectedCount').textContent = `已选择: ${totalSelected}`;
            document.getElementById('downloadSelectedBtn').disabled = totalSelected === 0;
            document.getElementById('viewSelectedBtn').disabled = totalSelected === 0;
        }

        function openSelectedModal() {
            renderSelectedGallery();
            document.getElementById('selectedModal').classList.add('active');
        }

        function closeSelectedModal() {
            document.getElementById('selectedModal').classList.remove('active');
        }

        function renderSelectedGallery() {
            const gallery = document.getElementById('selectedGallery');
            gallery.innerHTML = '';
            
            if (selectedCards.size === 0) {
                gallery.innerHTML = '<div class="empty-selected">暂无选中的卡牌</div>';
                return;
            }

            const sortedIndices = Array.from(selectedCards).sort((a, b) => a - b);
            
            sortedIndices.forEach(index => {
                const card = allCards[index];
                const imgUrl = getImageUrl(card.imageUrl);

                const cardDiv = document.createElement('div');
                cardDiv.className = 'selected-modal-card';
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'selected-modal-remove-btn';
                removeBtn.innerHTML = '×';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    toggleCardSelection(index);
                    if (selectedCards.size === 0) {
                        closeSelectedModal();
                    } else {
                        renderSelectedGallery();
                    }
                };
                
                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = '卡牌';
                
                cardDiv.appendChild(removeBtn);
                cardDiv.appendChild(img);
                gallery.appendChild(cardDiv);
            });
        }

        async function loadFilters() {
            try {
                const response = await fetch('filters.json');
                if (!response.ok) {
                    throw new Error('加载失败');
                }
                allCards = await response.json();
                document.getElementById('loading').style.display = 'none';
                renderGallery();
            } catch (error) {
                document.getElementById('loading').textContent = '加载失败';
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        function openModal(imgUrl, normalizedName) {
            currentImageUrl = imgUrl;
            currentNormalizedName = normalizedName;
            document.getElementById('modalImg').src = imgUrl;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        async function downloadSingleImage(imgUrl, normalizedName) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    canvas.toBlob(function(blob) {
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${normalizedName}.avif`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        resolve();
                    }, 'image/png');
                };
                img.onerror = function() {
                    reject(new Error('图片加载失败'));
                };
                img.src = imgUrl;
            });
        }

        async function downloadImage() {
            try {
                await downloadSingleImage(currentImageUrl, currentNormalizedName);
            } catch (error) {
                alert('下载失败: ' + error.message);
            }
        }

        async function downloadSelected() {
            const btn = document.getElementById('downloadSelectedBtn');
            const originalText = btn.textContent;
            const sortedIndices = Array.from(selectedCards).sort((a, b) => a - b);
            const total = sortedIndices.length;
            let completed = 0;
            
            btn.disabled = true;
            btn.textContent = `下载中...`;

            try {
                for (const index of sortedIndices) {
                    const card = allCards[index];
                    const imgUrl = getImageUrl(card.imageUrl);
                    const normalizedName = extractNormalizedName(card.imageUrl);
                    
                    try {
                        await downloadSingleImage(imgUrl, normalizedName);
                        completed++;
                        btn.textContent = `下载中... (${completed}/${total})`;
                        
                        await new Promise(resolve => setTimeout(resolve, 300));
                    } catch (error) {
                        console.error(`下载失败: ${normalizedName}`, error);
                    }
                }
                
                btn.textContent = `下载完成 (${completed}/${total})`;
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = selectedCards.size === 0;
                }, 2000);
            } catch (error) {
                alert('批量下载失败: ' + error.message);
                btn.textContent = originalText;
                btn.disabled = selectedCards.size === 0;
            }
        }

        document.getElementById('modal').onclick = function(e) {
            if (e.target === document.getElementById('modal')) {
                closeModal();
            }
        };

        document.querySelectorAll('.filter-checkbox').forEach((checkbox) => {
            checkbox.addEventListener('change', (e) => {
                const groupName = e.target.dataset.group;

                if (groupName === 'reserved') {
                    showReservedFilter = e.target.checked;
                    updateSelectionUI();
                    renderGallery();
                    return;
                }

                const groupBoxes = document.querySelectorAll(`.filter-checkbox[data-group="${groupName}"]`);

                if (e.target.value === 'all') {
                    groupBoxes.forEach((box) => {
                        box.checked = box.value === 'all';
                    });
                    setFilterGroupState(groupName, ['all']);
                } else {
                    const allBox = document.querySelector(`.filter-checkbox[data-group="${groupName}"][value="all"]`);
                    if (e.target.checked) {
                        if (allBox) allBox.checked = false;
                    }

                    const selectedValues = Array.from(groupBoxes)
                        .filter((box) => box.checked && box.value !== 'all')
                        .map((box) => box.value);

                    if (!selectedValues.length) {
                        groupBoxes.forEach((box) => {
                            box.checked = box.value === 'all';
                        });
                        setFilterGroupState(groupName, ['all']);
                    } else {
                        setFilterGroupState(groupName, selectedValues);
                    }
                }

                updateSelectionUI();
                renderGallery();
            });
        });

        document.getElementById('toggleFiltersBtn').addEventListener('click', () => {
            const filterBar = document.getElementById('filterBar');
            const isCollapsed = filterBar.classList.toggle('collapsed');
            document.getElementById('toggleFiltersBtn').textContent = isCollapsed ? '筛选' : '收起筛选';
        });

        document.getElementById('clearFiltersBtn').addEventListener('click', clearAllFilters);

        document.getElementById('search-input').addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            updateSelectionUI();
            renderGallery();
        });

        loadFilters();
    </script>
</body>
</html>
